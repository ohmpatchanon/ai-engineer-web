<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="RAG pipeline: chunk, embed, vector database, retrieve, rerank, generate">
<title>RAG pipeline: chunk, embed, retrieve, rerank, generate</title>
<desc>Offline indexing chunks documents with metadata, embeds them, and stores vectors. Online query is embedded, hybrid retrieval fetches candidates, cross-encoder reranks, and the LLM generates cited answers.</desc>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#17251c"/>
</marker>
</defs>
<rect width="800" height="450" rx="12" fill="#fdfef9" stroke="#d9dfd0" stroke-width="2"/>
<text x="30" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="800" fill="#17251c">RAG pipeline: retrieve evidence, then generate</text>
<text x="30" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#59645a">Offline builds the index. Online retrieves, reranks, and forces citations. No match → say so.</text>
<g>
<rect x="30" y="64" width="740" height="28" rx="7" fill="#17251c"/>
<text x="400" y="82" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#d3fa7c">OFFLINE — INDEXING (build once, refresh on doc change)</text>
<rect x="30" y="100" width="110" height="64" rx="8" fill="#ffffff" stroke="#17251c" stroke-width="2"/>
<text x="85" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#17251c">Docs</text>
<text x="85" y="142" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">pdf / web</text>
<line x1="140" y1="132" x2="162" y2="132" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="166" y="100" width="150" height="64" rx="8" fill="#ffffff" stroke="#17251c" stroke-width="2"/>
<text x="241" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#17251c">Chunk</text>
<text x="241" y="138" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">300–600 tok</text>
<text x="241" y="151" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">overlap 10–15%</text>
<text x="241" y="164" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">+ source / page</text>
<line x1="316" y1="132" x2="338" y2="132" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="342" y="100" width="120" height="64" rx="8" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
<text x="402" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">Embed</text>
<text x="402" y="142" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">dense vector</text>
<line x1="462" y1="132" x2="498" y2="132" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="502" y="100" width="268" height="64" rx="8" fill="#17251c"/>
<text x="636" y="122" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#f1f4e9">Vector DB (HNSW) + BM25</text>
<text x="636" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#a1ada2">vector + metadata filter</text>
<text x="636" y="154" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#a1ada2">delete old vectors on update</text>
</g>
<g>
<rect x="30" y="180" width="740" height="28" rx="7" fill="#15803d"/>
<text x="400" y="198" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#ffffff">ONLINE — QUERY TIME (per user question)</text>
<rect x="30" y="216" width="110" height="64" rx="8" fill="#ffffff" stroke="#17251c" stroke-width="2"/>
<text x="85" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#17251c">Query</text>
<text x="85" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">user question</text>
<line x1="140" y1="248" x2="162" y2="248" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="166" y="216" width="130" height="64" rx="8" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
<text x="231" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">Embed query</text>
<text x="231" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">same model</text>
<line x1="296" y1="248" x2="318" y2="248" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="322" y="216" width="150" height="64" rx="8" fill="#b45309" fill-opacity="0.10" stroke="#b45309" stroke-width="2"/>
<text x="397" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">Hybrid retrieve</text>
<text x="397" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">dense + BM25 → RRF</text>
<text x="397" y="269" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">top 20–50 candidates</text>
<line x1="472" y1="248" x2="494" y2="248" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="498" y="216" width="130" height="64" rx="8" fill="#6d28d9" fill-opacity="0.10" stroke="#6d28d9" stroke-width="2"/>
<text x="563" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#5b21b6">Rerank</text>
<text x="563" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">cross-encoder</text>
<text x="563" y="269" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">keep top 5–8</text>
<line x1="628" y1="248" x2="650" y2="248" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="654" y="216" width="116" height="64" rx="8" fill="#17251c"/>
<text x="712" y="240" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#f1f4e9">Generate</text>
<text x="712" y="258" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a1ada2">cite chunk ids</text>
</g>
<g>
<rect x="30" y="296" width="450" height="70" rx="10" fill="#ffffff" stroke="#d9dfd0"/>
<text x="48" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#17251c">Grounding checklist</text>
<text x="48" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17251c">• Prompt = question + ranked chunks + “cite or refuse”</text>
<text x="48" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17251c">• Verify every citation id exists in retrieved set</text>
<text x="48" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#b91c1c">• No evidence → “not in the documents” (never guess)</text>
</g>
<g>
<rect x="500" y="296" width="270" height="70" rx="10" fill="#b91c1c" fill-opacity="0.08" stroke="#b91c1c"/>
<text x="516" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#b91c1c">Debug order</text>
<text x="516" y="338" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17251c">retrieval → context → generation</text>
<text x="516" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17251c">Measure recall@k, relevance, faithfulness</text>
<text x="516" y="368" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#59645a">separately. Bad chunks beat a good prompt.</text>
</g>
<line x1="636" y1="164" x2="636" y2="216" stroke="#17251c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Production architecture: gateway, cache, router, models, monitor with observability loop">
<title>Production architecture: gateway, cache, router, models, monitor</title>
<desc>Requests flow through gateway, cache, router, and models. Observability at the bottom logs traces, metrics, and evals, and feeds back to canary, rollback, and tuning. Resilience uses timeout, retry with backoff, circuit breaker, and fallback.</desc>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#17251c"/>
</marker>
</defs>
<rect width="800" height="450" rx="12" fill="#fdfef9" stroke="#d9dfd0" stroke-width="2"/>
<text x="30" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="800" fill="#17251c">Production path: gateway → cache → router → models → monitor</text>
<text x="30" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#59645a">Every stage must degrade gracefully. The bottom loop watches drift and routes fixes back.</text>
<g>
<rect x="30" y="66" width="110" height="140" rx="10" fill="#ffffff" stroke="#17251c" stroke-width="2"/>
<text x="85" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#17251c">Client</text>
<text x="85" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">streaming UI</text>
<text x="85" y="124" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">SSE</text>
<text x="85" y="180" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#59645a">TTFT + tokens/s</text>
<line x1="140" y1="136" x2="162" y2="136" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="166" y="66" width="140" height="140" rx="10" fill="#1d4ed8" fill-opacity="0.10" stroke="#1d4ed8" stroke-width="2"/>
<text x="236" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">Gateway</text>
<text x="236" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">auth · quota</text>
<text x="236" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">rate-limit</text>
<text x="236" y="138" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">timeout per call</text>
<text x="236" y="152" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">trace_id in</text>
<text x="236" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#59645a">contract lives here</text>
<line x1="306" y1="136" x2="328" y2="136" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="332" y="66" width="120" height="140" rx="10" fill="#b45309" fill-opacity="0.10" stroke="#b45309" stroke-width="2"/>
<text x="392" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">Cache</text>
<text x="392" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">exact + prefix</text>
<text x="392" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">semantic</text>
<text x="392" y="138" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">TTL + version</text>
<text x="392" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#59645a">measure hit rate</text>
<line x1="452" y1="136" x2="474" y2="136" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="478" y="66" width="140" height="140" rx="10" fill="#6d28d9" fill-opacity="0.10" stroke="#6d28d9" stroke-width="2"/>
<text x="548" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#5b21b6">Router</text>
<text x="548" y="108" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">small vs large</text>
<text x="548" y="122" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">rules / model</text>
<text x="548" y="138" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#17251c">task type</text>
<text x="548" y="180" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#59645a">never largest always</text>
<line x1="618" y1="136" x2="640" y2="136" stroke="#17251c" stroke-width="2" marker-end="url(#arrB)"/>
<rect x="644" y="66" width="126" height="140" rx="10" fill="#17251c"/>
<text x="707" y="90" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#f1f4e9">Models</text>
<text x="707" y="106" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a1ada2">3–8B fast</text>
<text x="707" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a1ada2">large capable</text>
<text x="707" y="134" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a1ada2">embed / rerank</text>
<text x="707" y="150" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#a1ada2">fallback small</text>
<text x="707" y="178" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#a1ada2">batch vs live</text>
</g>
<g>
<rect x="30" y="222" width="740" height="96" rx="10" fill="#ffffff" stroke="#d9dfd0" stroke-width="1.5"/>
<text x="48" y="244" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#17251c">Resilience spine (applies to every call)</text>
<g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#17251c">
<rect x="48" y="254" width="160" height="46" rx="8" fill="#f6f5ed" stroke="#d9dfd0"/>
<text x="128" y="274" text-anchor="middle">timeout</text>
<text x="128" y="290" text-anchor="middle" font-size="9" fill="#59645a">every downstream</text>
<rect x="224" y="254" width="160" height="46" rx="8" fill="#f6f5ed" stroke="#d9dfd0"/>
<text x="304" y="274" text-anchor="middle">retry + backoff + jitter</text>
<text x="304" y="290" text-anchor="middle" font-size="9" fill="#59645a">max 2–3, 1s → 2s → 4s</text>
<rect x="400" y="254" width="160" height="46" rx="8" fill="#f6f5ed" stroke="#d9dfd0"/>
<text x="480" y="274" text-anchor="middle">circuit breaker</text>
<text x="480" y="290" text-anchor="middle" font-size="9" fill="#59645a">stop hammering</text>
<rect x="576" y="254" width="176" height="46" rx="8" fill="#f6f5ed" stroke="#d9dfd0"/>
<text x="664" y="274" text-anchor="middle">fallback answer</text>
<text x="664" y="290" text-anchor="middle" font-size="9" fill="#59645a">cached / template</text>
</g>
</g>
<g>
<rect x="30" y="332" width="740" height="86" rx="10" fill="#17251c"/>
<text x="48" y="354" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#d3fa7c">OBSERVABILITY LOOP</text>
<text x="48" y="374" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#f1f4e9">logs + traces (trace_id, tokens, cost) → metrics (p95, TTFT, err, citation) → evals (golden set, PSI drift)</text>
<text x="48" y="392" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#a1ada2">→ canary 5% → promote / rollback · tune router, cache, prompt</text>
<text x="48" y="408" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a1ada2">last 20–50 traces → new eval cases → next deploy. Cost per request is a first-class metric.</text>
<path d="M707 206 L707 332" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)"/>
<path d="M100 332 L100 206" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrB)"/>
<text x="712" y="268" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#15803d">traces up</text>
<text x="40" y="268" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#15803d">fixes back</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Neural network layers with forward and backward passes and vanishing gradient note">
<title>Neural network: layers, forward and backward passes</title>
<desc>Input, hidden, and output layers. Forward pass computes z equals W x plus b and activation. Backward pass returns gradients via the chain rule. Small Jacobian products cause vanishing gradients.</desc>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#1d4ed8"/>
</marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#b91c1c"/>
</marker>
</defs>
<rect width="800" height="450" rx="12" fill="#fdfef9" stroke="#d9dfd0" stroke-width="2"/>
<text x="30" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="800" fill="#17251c">Neural network: forward once, backward once per batch</text>
<text x="30" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#59645a">Forward computes predictions; backward returns gradients through the chain rule.</text>
<g>
<line x1="110" y1="84" x2="700" y2="84" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrB)"/>
<text x="405" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">FORWARD  z = Wx + b → a = σ(z) → ŷ → loss L</text>
<line x1="700" y1="320" x2="110" y2="320" stroke="#b91c1c" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#arrR)"/>
<text x="405" y="338" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">BACKWARD  ∂L/∂θ = ∂L/∂a · ∂a/∂z · ∂z/∂θ (chain rule)</text>
</g>
<g stroke="#d9dfd0" stroke-width="1">
<line x1="150" y1="160" x2="320" y2="130"/>
<line x1="150" y1="160" x2="320" y2="175"/>
<line x1="150" y1="160" x2="320" y2="235"/>
<line x1="150" y1="230" x2="320" y2="130"/>
<line x1="150" y1="230" x2="320" y2="175"/>
<line x1="150" y1="230" x2="320" y2="235"/>
<line x1="150" y1="290" x2="320" y2="130"/>
<line x1="150" y1="290" x2="320" y2="175"/>
<line x1="150" y1="290" x2="320" y2="235"/>
<line x1="320" y1="130" x2="490" y2="155"/>
<line x1="320" y1="130" x2="490" y2="210"/>
<line x1="320" y1="130" x2="490" y2="270"/>
<line x1="320" y1="175" x2="490" y2="155"/>
<line x1="320" y1="175" x2="490" y2="210"/>
<line x1="320" y1="175" x2="490" y2="270"/>
<line x1="320" y1="235" x2="490" y2="155"/>
<line x1="320" y1="235" x2="490" y2="210"/>
<line x1="320" y1="235" x2="490" y2="270"/>
<line x1="490" y1="155" x2="630" y2="190"/>
<line x1="490" y1="155" x2="630" y2="235"/>
<line x1="490" y1="210" x2="630" y2="190"/>
<line x1="490" y1="210" x2="630" y2="235"/>
<line x1="490" y1="270" x2="630" y2="190"/>
<line x1="490" y1="270" x2="630" y2="235"/>
</g>
<g>
<circle cx="150" cy="160" r="16" fill="#ffffff" stroke="#17251c" stroke-width="2.5"/>
<circle cx="150" cy="230" r="16" fill="#ffffff" stroke="#17251c" stroke-width="2.5"/>
<circle cx="150" cy="290" r="16" fill="#ffffff" stroke="#17251c" stroke-width="2.5"/>
<circle cx="320" cy="130" r="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="320" cy="175" r="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="320" cy="235" r="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="490" cy="155" r="16" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
<circle cx="490" cy="210" r="16" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
<circle cx="490" cy="270" r="16" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
<circle cx="630" cy="190" r="18" fill="#17251c" stroke="#17251c" stroke-width="2"/>
<circle cx="630" cy="235" r="18" fill="#17251c" stroke="#17251c" stroke-width="2"/>
<text x="627" y="195" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#d3fa7c">ŷ</text>
<text x="627" y="240" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#d3fa7c">ŷ</text>
</g>
<text x="150" y="320" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17251c">Input x</text>
<text x="320" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">Hidden 1 (σ)</text>
<text x="490" y="300" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b21b6">Hidden 2 (σ)</text>
<text x="630" y="262" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#17251c">Output ŷ</text>
<g>
<rect x="680" y="180" width="90" height="64" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
<text x="725" y="205" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#b91c1c">Loss L</text>
<text x="725" y="224" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#59645a">minus true</text>
<line x1="655" y1="212" x2="680" y2="212" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrR)"/>
</g>
<g>
<rect x="30" y="358" width="740" height="62" rx="10" fill="#b45309" fill-opacity="0.08" stroke="#b45309" stroke-width="2"/>
<text x="48" y="382" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">⚠ Vanishing gradient: product of many small Jacobians (sigmoid/tanh, tiny init) → early layers ≈ 0</text>
<text x="48" y="402" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#17251c">Fixes: He/Xavier init, ReLU, Batch/LayerNorm, residual paths, gradient clipping.</text>
</g>
</svg>

    <circle r="52" fill="#d3fa7c" fill-opacity=".10" stroke="#d3fa7c" stroke-opacity=".7"/>
    <path d="M-18 26V-26h13c9 0 14.5 5 14.5 13 0 6-3 10-8.2 11.7L10 26H0.8L-6.5 9.5H-8V26h-10Zm10-23.5v11h4.4c4.2 0 6.6-2.2 6.6-5.5s-2.4-5.5-6.6-5.5H-8Z" fill="#d3fa7c"/>

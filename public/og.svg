<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Road to AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d0b"/>
      <stop offset="1" stop-color="#111510"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#d3fa7c" stop-opacity=".20"/>
      <stop offset="1" stop-color="#d3fa7c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
